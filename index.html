<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #f9fafb;
    }

    .calculator {
      width: 320px;
      background: rgba(17, 24, 39, 0.9);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .display {
      width: 100%;
      height: 80px;
      margin-bottom: 18px;
      border: none;
      border-radius: 12px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 2rem;
      text-align: right;
      padding: 18px 14px;
      letter-spacing: 1px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 58px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
      background: #374151;
      color: #f9fafb;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
    }

    .equals {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }

    .clear {
      background: #ef4444;
    }

    .delete {
      background: #6b7280;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly value="0" />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="delete" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="handleOperator('/')">÷</button>
      <button class="operator" onclick="handleOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="handleOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="handleOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equals" onclick="calculateResult()">=</button>

      <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    let currentValue = '0';
    let storedValue = null;
    let operator = null;
    let waitingForSecondValue = false;

    function updateDisplay() {
      display.value = currentValue;
    }

    function clearDisplay() {
      currentValue = '0';
      storedValue = null;
      operator = null;
      waitingForSecondValue = false;
      updateDisplay();
    }

    function deleteLast() {
      if (waitingForSecondValue) return;

      if (currentValue.length <= 1 || currentValue === '0') {
        currentValue = '0';
      } else {
        currentValue = currentValue.slice(0, -1);
      }
      updateDisplay();
    }

    function appendNumber(value) {
      if (waitingForSecondValue) {
        currentValue = value;
        waitingForSecondValue = false;
      } else {
        currentValue = currentValue === '0' && value !== '.' ? value : currentValue + value;
      }

      if (value === '.' && currentValue.includes('.')) {
        currentValue = currentValue.slice(0, -1);
      }

      updateDisplay();
    }

    function handleOperator(nextOperator) {
      const inputValue = Number(currentValue);

      if (storedValue === null) {
        storedValue = inputValue;
      } else if (operator) {
        const result = performCalculation(storedValue, inputValue, operator);
        currentValue = String(result);
        storedValue = result;
      }

      waitingForSecondValue = true;
      operator = nextOperator;
      updateDisplay();
    }

    function performCalculation(first, second, op) {
      switch (op) {
        case '+':
          return first + second;
        case '-':
          return first - second;
        case '*':
          return first * second;
        case '/':
          return second === 0 ? 'Error' : first / second;
        default:
          return second;
      }
    }

    function calculateResult() {
      if (storedValue === null || operator === null || waitingForSecondValue) {
        return;
      }

      const result = performCalculation(storedValue, Number(currentValue), operator);

      currentValue = String(result);
      storedValue = null;
      operator = null;
      waitingForSecondValue = false;

      if (currentValue === 'Error') {
        currentValue = '0';
      }

      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
